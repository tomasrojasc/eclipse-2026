[project]
name = "ejemplo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "skyfield>=1.55",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.27.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
